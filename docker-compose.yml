# Qdrant Memory Server Stack
# Run: docker-compose up -d
#
# Services:
# - qdrant: Vector database (port 6333)
# - memory-mcp: MCP server for OpenCode (port 8081)
#
# Environment variables for memory-mcp:
# - QDRANT_URL: URL to Qdrant (default: http://qdrant:6333)
# - QDRANT_API_KEY: Optional API key for Qdrant Cloud
# - PORT: MCP server port (default: 8081)

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  memory-mcp:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PORT=8081
    restart: unless-stopped

volumes:
  qdrant_storage:
